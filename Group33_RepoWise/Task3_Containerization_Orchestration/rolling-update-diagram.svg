<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .hdr-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .phase-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .pod-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #0f172a; }
      .pod-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #64748b; }
      .pod-tag-v1 { fill: #2563eb; font-weight: 700; font-size: 9px; }
      .pod-tag-v2 { fill: #16a34a; font-weight: 700; font-size: 9px; }
      .pod-tag-term { fill: #dc2626; font-weight: 700; font-size: 9px; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #2563eb; }
      .card-body { rx: 6px; ry: 6px; fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.04)); }
      .cmd-box { font-family: 'JetBrains Mono', Courier, monospace; font-size: 8.5px; fill: #1e293b; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#f8fafc" rx="10" ry="10" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="30" y="32" class="hdr-title">Kubernetes Rolling Update & Rollback Architecture — RepoWise Server</text>
  <text x="30" y="48" class="hdr-sub">Zero-Downtime Deployment Lifecycle (maxSurge=1, maxUnavailable=0) & Instant Rollout Reversion</text>

  <!-- PHASE 1: STABLE V1.0.0 -->
  <g transform="translate(30, 70)">
    <rect width="270" height="260" class="card-body" />
    <path d="M 0 0 L 270 0 L 270 34 L 0 34 Z" fill="#2563eb" rx="6" />
    <text x="135" y="22" text-anchor="middle" class="phase-hdr">Phase 1: Stable v1.0.0 State</text>

    <!-- Command text -->
    <rect x="15" y="46" width="240" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="25" y="62" class="cmd-box">kubectl apply -f deployment.yaml</text>

    <text x="20" y="90" font-family="sans-serif" font-size="9.5px" font-weight="600" fill="#475569">ReplicaSet A (v1.0.0): 3 / 3 Ready</text>

    <!-- Pod 1 -->
    <rect x="20" y="102" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="121" r="6" fill="#16a34a" />
    <text x="50" y="118" class="pod-text">repowise-server-67f9b8c-1</text>
    <text x="50" y="131" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0</tspan> &bull; Status: Running (Ready: 1/1)</text>

    <!-- Pod 2 -->
    <rect x="20" y="148" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="167" r="6" fill="#16a34a" />
    <text x="50" y="164" class="pod-text">repowise-server-67f9b8c-2</text>
    <text x="50" y="177" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0</tspan> &bull; Status: Running (Ready: 1/1)</text>

    <!-- Pod 3 -->
    <rect x="20" y="194" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="213" r="6" fill="#16a34a" />
    <text x="50" y="210" class="pod-text">repowise-server-67f9b8c-3</text>
    <text x="50" y="223" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0</tspan> &bull; Status: Running (Ready: 1/1)</text>

    <text x="135" y="250" text-anchor="middle" font-family="sans-serif" font-size="8.5px" fill="#15803d" font-weight="600">✓ 100% Traffic routed to ReplicaSet A</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="300" y1="200" x2="335" y2="200" class="arrow" marker-end="url(#arrow)" />

  <!-- PHASE 2: ROLLING UPDATE IN PROGRESS -->
  <g transform="translate(345, 70)">
    <rect width="270" height="260" class="card-body" />
    <path d="M 0 0 L 270 0 L 270 34 L 0 34 Z" fill="#0d9488" rx="6" />
    <text x="135" y="22" text-anchor="middle" class="phase-hdr">Phase 2: Rolling Update &rarr; v2.0.0</text>

    <!-- Command text -->
    <rect x="15" y="46" width="240" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="25" y="62" class="cmd-box">kubectl set image ...:v2.0.0</text>

    <text x="20" y="90" font-family="sans-serif" font-size="9.5px" font-weight="600" fill="#475569">maxSurge: 1 &bull; maxUnavailable: 0</text>

    <!-- New Pod v2 (Ready) -->
    <rect x="20" y="102" width="230" height="38" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
    <circle cx="36" cy="121" r="6" fill="#16a34a" />
    <text x="50" y="118" class="pod-text">repowise-server-85d1c4e-1</text>
    <text x="50" y="131" class="pod-sub">Image: <tspan class="pod-tag-v2">:v2.0.0 (New)</tspan> &bull; Status: Ready</text>

    <!-- New Pod v2 (Starting) -->
    <rect x="20" y="148" width="230" height="38" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
    <circle cx="36" cy="167" r="6" fill="#0284c7" />
    <text x="50" y="164" class="pod-text">repowise-server-85d1c4e-2</text>
    <text x="50" y="177" class="pod-sub">Image: <tspan class="pod-tag-v2">:v2.0.0</tspan> &bull; Status: ContainerCreating</text>

    <!-- Old Pod v1 (Terminating) -->
    <rect x="20" y="194" width="230" height="38" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <circle cx="36" cy="213" r="6" fill="#dc2626" />
    <text x="50" y="210" class="pod-text" fill="#991b1b">repowise-server-67f9b8c-1</text>
    <text x="50" y="223" class="pod-sub">Image: <tspan class="pod-tag-term">:v1.0.0</tspan> &bull; Status: Terminating</text>

    <text x="135" y="250" text-anchor="middle" font-family="sans-serif" font-size="8.5px" fill="#0369a1" font-weight="600">✓ Zero downtime: capacity never drops</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="615" y1="200" x2="650" y2="200" class="arrow" marker-end="url(#arrow)" />

  <!-- PHASE 3: INSTANT ROLLBACK -->
  <g transform="translate(660, 70)">
    <rect width="270" height="260" class="card-body" />
    <path d="M 0 0 L 270 0 L 270 34 L 0 34 Z" fill="#e11d48" rx="6" />
    <text x="135" y="22" text-anchor="middle" class="phase-hdr">Phase 3: Rollback Execution</text>

    <!-- Command text -->
    <rect x="15" y="46" width="240" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="25" y="62" class="cmd-box">kubectl rollout undo deployment/...</text>

    <text x="20" y="90" font-family="sans-serif" font-size="9.5px" font-weight="600" fill="#475569">Reverting back to previous Revision</text>

    <!-- Restored Pod 1 -->
    <rect x="20" y="102" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="121" r="6" fill="#16a34a" />
    <text x="50" y="118" class="pod-text">repowise-server-67f9b8c-1</text>
    <text x="50" y="131" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0 (Restored)</tspan> &bull; Ready</text>

    <!-- Restored Pod 2 -->
    <rect x="20" y="148" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="167" r="6" fill="#16a34a" />
    <text x="50" y="164" class="pod-text">repowise-server-67f9b8c-2</text>
    <text x="50" y="177" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0 (Restored)</tspan> &bull; Ready</text>

    <!-- Restored Pod 3 -->
    <rect x="20" y="194" width="230" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="36" cy="213" r="6" fill="#16a34a" />
    <text x="50" y="210" class="pod-text">repowise-server-67f9b8c-3</text>
    <text x="50" y="223" class="pod-sub">Image: <tspan class="pod-tag-v1">:v1.0.0 (Restored)</tspan> &bull; Ready</text>

    <text x="135" y="250" text-anchor="middle" font-family="sans-serif" font-size="8.5px" fill="#be123c" font-weight="600">✓ Rollback complete in &lt; 4 seconds!</text>
  </g>
</svg>
