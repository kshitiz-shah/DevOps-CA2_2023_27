apiVersion: v1
kind: Service
metadata:
  name: repowise-service
  labels:
    app: repowise-server
    tier: backend
spec:
  type: NodePort
  selector:
    app: repowise-server
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
