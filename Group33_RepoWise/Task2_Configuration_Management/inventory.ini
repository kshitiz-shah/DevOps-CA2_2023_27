# ==============================================================================
# Ansible Inventory Configuration for RepoWise Server Infrastructure
# ==============================================================================

[staging]
repowise-staging-01 ansible_host=192.168.1.110 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[production]
repowise-prod-01    ansible_host=10.0.1.101     ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
repowise-prod-02    ansible_host=10.0.1.102     ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Parent Group aggregating all RepoWise application runtime environments
[repowise_servers:children]
staging
production

# Local development / CI test target (runs locally without remote SSH)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Global configuration variables applied across all RepoWise servers
[repowise_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Application Runtime Configuration Variables
app_name=repowise
app_user=repowise_deployer
app_group=repowise
app_port=5000
app_root_dir=/opt/repowise
node_version=22
database_port=5432
qdrant_port=6333
