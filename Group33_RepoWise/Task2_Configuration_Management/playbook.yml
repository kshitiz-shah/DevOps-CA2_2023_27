---
# ==============================================================================
# Ansible Playbook: Infrastructure as Code (IaC) & Server Runtime Configuration
# Target: RepoWise Application Backend Server Environments
# ==============================================================================

- name: 🚀 Configure RepoWise Runtime Server Environment
  hosts: repowise_servers, local
  become: true
  gather_facts: true

  vars:
    app_name: repowise
    app_user: repowise_deployer
    app_group: repowise
    app_port: 5000
    app_root_dir: /opt/repowise
    node_version: "22.x"
    database_port: 5432
    qdrant_port: 6333
    required_packages:
      - curl
      - gnupg
      - git
      - ufw
      - htop
      - ca-certificates
      - tar
      - unzip
      - nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true

    - name: Reload Systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart RepoWise
      ansible.builtin.service:
        name: repowise
        state: restarted
        enabled: true

  tasks:
    # ==========================================================================
    # SECTION 1: SYSTEM PACKAGES INSTALLATION
    # ==========================================================================
    - name: 🔄 Update apt cache repository index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: 📦 Install foundational system packages & utilities
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: 🔑 Add NodeSource GPG signing key
      ansible.builtin.apt_key:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present
      when: ansible_os_family == "Debian"

    - name: 🌐 Configure NodeSource Node.js {{ node_version }} repository
      ansible.builtin.apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }} nodistro main"
        state: present
        filename: nodesource
      when: ansible_os_family == "Debian"

    - name: 🟢 Install Node.js runtime and npm
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: 🐳 Install Docker container runtime & Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "Debian"

    - name: ⚙️ Ensure Docker service is running and enabled on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      ignore_errors: true

    # ==========================================================================
    # SECTION 2: USER & GROUP MANAGEMENT
    # ==========================================================================
    - name: 👥 Create dedicated application system group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present
        system: true

    - name: 👤 Create application service user with restricted shell
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups:
          - docker
          - sudo
        shell: /bin/bash
        home: "{{ app_root_dir }}"
        create_home: false
        system: true
        state: present

    - name: 🔐 Configure passwordless sudo for service restarts
      ansible.builtin.copy:
        dest: /etc/sudoers.d/repowise_service_restart
        content: "{{ app_user }} ALL=(ALL) NOPASSWD: /bin/systemctl restart repowise, /bin/systemctl status repowise\n"
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    # ==========================================================================
    # SECTION 3: FILE & DIRECTORY MANAGEMENT
    # ==========================================================================
    - name: 📁 Create RepoWise directory hierarchy with secure permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0750'
      loop:
        - "{{ app_root_dir }}"
        - "{{ app_root_dir }}/app"
        - "{{ app_root_dir }}/config"
        - "{{ app_root_dir }}/logs"

    - name: 📄 Deploy application runtime environment file from template
      ansible.builtin.template:
        src: templates/repowise.env.j2
        dest: "{{ app_root_dir }}/config/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'
      notify: Restart RepoWise

    - name: 🌐 Deploy Nginx reverse proxy configuration from template
      ansible.builtin.template:
        src: templates/repowise.conf.j2
        dest: /etc/nginx/sites-available/repowise.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx

    - name: 🔗 Enable Nginx site configuration via symlink
      ansible.builtin.file:
        src: /etc/nginx/sites-available/repowise.conf
        dest: /etc/nginx/sites-enabled/repowise.conf
        state: link
      notify: Restart Nginx

    - name: 🧹 Remove default Nginx virtual host configuration
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: ⚙️ Deploy Systemd Service Unit File from template
      ansible.builtin.template:
        src: templates/repowise.service.j2
        dest: /etc/systemd/system/repowise.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload Systemd
        - Restart RepoWise

    # ==========================================================================
    # SECTION 4: POST-PROVISIONING HEALTH VERIFICATION
    # ==========================================================================
    - name: 📋 Display runtime environment configuration summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "✅ RepoWise Server Runtime Environment Configured!"
          - "Host: {{ inventory_hostname }}"
          - "Application Root: {{ app_root_dir }}"
          - "Service User: {{ app_user }}:{{ app_group }}"
          - "Nginx Reverse Proxy: Port 80 -> 127.0.0.1:{{ app_port }}"
          - "=========================================================="
